# CI is the only gate between a commit and consumers: packages here are
# linked source-first by product repos, so a broken main breaks every
# consumer's next build. Integration tests use Testcontainers, which needs
# the Docker daemon ubuntu-latest provides.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Codegen drift check
        # Generated code is committed for reviewability; regenerating must
        # be a no-op or someone edited generated files (or forgot to run
        # codegen after a proto change).
        run: |
          npm run codegen
          git diff --exit-code -- 'packages/*/src/gen'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
