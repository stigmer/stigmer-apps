# One pipeline for the whole monorepo — commons and apps together. CI is
# the only gate between a commit and production AND, since T06 of the
# law-practice-platform project, the only producer of the production
# image (the Planton Service Hub build is retired; its push trigger
# never fired — the repo had no webhook). Everything that must hold,
# holds here.
#
# The guard runs FIRST and needs no dependencies: this repo is public,
# so customer-specific strings are a failure on EVERY path (the hub
# model, project DD-006 — per-client config and operating records live
# in the private stigmer-cloud repo).
#
# Build precedes typecheck and test deliberately: @law/backend resolves
# @stigmer/resource-api through the workspace link, whose exports point at
# dist/ — the commons must be built before anything downstream compiles.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the image job alone elevates to
# packages: write for the ghcr push.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Customer-data guard
        # Generic patterns live in the repo; the customer-name denylist is
        # a secret because a committed list would spell out the names it
        # blocks. Fork PRs get no secrets — the script warns and runs
        # generic-only there, but hard-fails on push if the secret is
        # missing.
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: node scripts/check-customer-data.mjs

      - name: Image-reference guard
        # The image job pushes where the chart's image_repo default says
        # firms pull from; a rename in one file must fail here, not as a
        # pull error during a production install.
        run: node scripts/check-image-reference.mjs

      - name: Install
        run: npm ci

      - name: Codegen drift check
        # Generated code is committed for reviewability; regenerating must
        # be a no-op or someone edited generated files (or forgot to run
        # codegen after a proto change).
        run: |
          npm run codegen
          git diff --exit-code -- packages/resource-api/src/gen packages/identity/src/gen apps/law/backend/src/gen apps/law/web/src/gen

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Integration tests run against real Postgres (and MinIO for the
        # document flow) via Testcontainers — ubuntu-latest provides the
        # Docker daemon.
        run: npm test

  # The web app's working-day flows through real Chromium against the real
  # backend (T04b): src/e2e/serve.ts boots Postgres in a container, seeds
  # fictional users through the operator path, and serves the app's build
  # the way the deployed image does (dist/public).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Commons first (workspace links point at dist/), then the web
        # build the E2E backend serves.
        run: npm run build

      # The browser download + apt dependency install cost ~10 minutes
      # from scratch on every run. Three cuts, in order of effect:
      # cache the browser binaries keyed on the INSTALLED Playwright
      # version (the only thing that changes them — a lockfile hash
      # would churn the cache on unrelated dependency bumps); download
      # only the headless shell (every e2e run here is headless — the
      # full headed Chromium is dead weight); and on a cache hit run
      # only the quick OS-dependency step, skipping the download
      # entirely.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/law/web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        # Browsers restored from cache still need the OS libraries —
        # apt-only, no download; the fast path.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Web E2E
        run: npm run test:e2e -w @law/web

  # CI is the ONLY producer of the deployed image: every merge to main
  # pushes ghcr.io/stigmer/stigmer-apps/law-backend:<git-sha>. The push
  # sits behind the full suite (needs: check + e2e) and this job's own
  # boot check, so an image no test has seen cannot exist in the
  # registry. Releases stay deliberate: the per-firm chart pins an exact
  # sha as image_tag, so publishing an image deploys nothing.
  #
  # The tag is the FULL 40-char commit sha — every firm's private values
  # file pins that exact format; a short sha would strand every pin. The
  # registry path is hardcoded (not derived from github.repository) on
  # purpose: it is a wire contract with those values files, and the
  # check job's image-reference guard greps for the literal.
  #
  # No path filter, deliberately: every green main commit gets an image,
  # so "any green sha is pinnable" holds with no exceptions (GitHub's
  # event-level paths: filter is also silently skipped on oversized
  # pushes — see release.sandbox-cloud.yaml in stigmer/stigmer).
  #
  # The package must stay PUBLIC: the deployed platform version ignores
  # the registry-connection annotation on chart-rendered deployments, so
  # firm image pulls are unauthenticated. If the package is ever deleted,
  # a GITHUB_TOKEN push recreates it PRIVATE and every firm install
  # starts failing at pull time — restore public visibility in the org
  # package settings.
  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build law backend image
        # Explicit platform: the GKE nodes are amd64, and a future
        # arm64 runner default must not silently produce an image the
        # cluster cannot run.
        run: |
          docker build --platform linux/amd64 \
            -f apps/law/backend/Dockerfile -t law-backend:ci .

      - name: Boot check
        # With no environment the bundle must reach the config loader and
        # fail fast with the accumulated error — not a SyntaxError or a
        # module crash. The bundle suite (bundle.integration.test.ts)
        # proves a full boot against real Postgres; this proves the same
        # artifact inside the image's runtime (alpine, non-root user).
        run: |
          set +e
          output=$(docker run --rm law-backend:ci 2>&1)
          set -e
          echo "$output"
          echo "$output" | grep -q "Invalid backend configuration"

      # Push only on merges to main (the push trigger is already
      # main-only, so the event name is the complete condition). PRs run
      # the build and boot check but never publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the boot-checked image
        # Tag and push the SAME local image the boot check ran — never a
        # buildx --push rebuild — so what ships is byte-for-byte what
        # booted.
        if: github.event_name == 'push'
        run: |
          docker tag law-backend:ci ghcr.io/stigmer/stigmer-apps/law-backend:${{ github.sha }}
          docker push ghcr.io/stigmer/stigmer-apps/law-backend:${{ github.sha }}
          echo "Pushed ghcr.io/stigmer/stigmer-apps/law-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # ── The per-firm FGA engine image (project DD-003 D1): upstream
      # OpenFGA + a baked migrate-then-run command (images/openfga has
      # the full why — the live platform models no command/args and no
      # init containers). Content-versioned by the ENGINE version, not
      # the git sha: the tag only changes when the wrapper or the
      # upstream pin does, and re-pushing identical content is a no-op.
      # This package must stay PUBLIC, same as law-backend above.
      - name: Build FGA engine image
        run: |
          docker build --platform linux/amd64 \
            -f images/openfga/Dockerfile -t law-openfga:ci images/openfga

      - name: FGA engine boot check
        # With no environment the entrypoint must reach the real binary
        # and fail fast on the missing datastore — proving the busybox
        # shell wiring and the migrate-first sequencing survived a base
        # image bump.
        run: |
          set +e
          output=$(docker run --rm law-openfga:ci 2>&1)
          set -e
          echo "$output"
          echo "$output" | grep -q "missing datastore engine type"

      - name: Push the FGA engine image
        if: github.event_name == 'push'
        run: |
          tag=$(grep -oE 'openfga/openfga:v[0-9.]+' images/openfga/Dockerfile | cut -d: -f2)
          docker tag law-openfga:ci ghcr.io/stigmer/stigmer-apps/law-openfga:"$tag"
          docker push ghcr.io/stigmer/stigmer-apps/law-openfga:"$tag"
          echo "Pushed ghcr.io/stigmer/stigmer-apps/law-openfga:$tag" >> "$GITHUB_STEP_SUMMARY"
