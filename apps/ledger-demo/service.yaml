# Service Hub's record of Acme Books, the integrator demo, in the stigmer organization on Planton: where
# its source lives, how it is built, and that it deploys from _kustomize/, one environment per directory
# under overlays/ (demo only). Registered once with `planton apply -f service.yaml --instance
# prod.planton.ai --org stigmer`; from then on a merge to main that touches this folder builds it and
# deploys demo.
apiVersion: service-hub.planton.ai/v1alpha1
kind: Service
metadata:
  name: acme-books
  org: stigmer
  slug: acme-books
spec:
  description: "Acme Books, the integrator demo: a small accounting product with Stigmer's chat panel inside it, and its ledger MCP server"
  gitRepo:
    gitConnection: github-stigmer # the connection to the stigmer GitHub organization
    ownerName: stigmer
    name: stigmer-apps
    defaultBranch: main
    browserUrl: https://github.com/stigmer/stigmer-apps
    cloneUrl: https://github.com/stigmer/stigmer-apps.git
    gitRepoProvider: github
    projectRoot: apps/ledger-demo # a change under it triggers a build, and the kustomize tree is read from here
  build:
    # The folder is its own package with its own lockfile, so it builds from itself.
    dockerfile:
      context: apps/ledger-demo
      dockerfilePath: apps/ledger-demo/Dockerfile
    registry: gar-stigmer # the hosted service's Artifact Registry repository, which its clusters read
    imageRepositoryPath: acme-books
  deploy:
    kustomize:
      baseDirectory: _kustomize
