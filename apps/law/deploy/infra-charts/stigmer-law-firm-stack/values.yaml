# Reference defaults for the Stigmer Law Firm Stack. These are NOT merged
# at install time — `planton chart install --values` replaces them, so the
# per-firm values file must carry EVERY param below (verified against a
# live pipeline failure: an omitted cloudflare_account_id rendered an empty
# accountId and failed stack-input validation). Per-firm values files live
# in the private ops repo (stigmer-cloud
# _ops/planton/clients/law/<client>/infra-project/) — this repo is public
# and carries no customer-named config (DD-A10).
params:
  # ─── Pulumi / Planton stack identity ────────────────────────────────────────
  - name: pulumi_organization
    description: Pulumi organization name
    value: stigmer

  - name: pulumi_project
    description: Pulumi project name
    value: stigmer

  - name: env
    description: Environment name (used for stack naming and metadata)
    value: prod

  - name: org
    description: Planton organization slug
    value: stigmer

  # ─── Firm identity ───────────────────────────────────────────────────────────
  # REQUIRED, no usable default: the firm slug names every resource this chart
  # renders (an empty value would render malformed resource names). Short,
  # lowercase, DNS-safe — set it ONLY in the client's values file in the
  # private ops repo, never here.
  - name: firm
    description: Firm slug (lowercase DNS-safe, e.g. a firm's initials); set per install
    value: ""

  # ─── Cloudflare R2 ───────────────────────────────────────────────────────────
  # The account ID is the same across environments and firms, so it lives here
  # as a default (same convention as stigmer-infrastructure-stack).
  - name: cloudflare_account_id
    description: Cloudflare account ID for R2 bucket provisioning
    value: "074755a78d8e8f77c119a90a125e8a06"

  - name: r2_location
    description: R2 bucket location hint (wnam, enam, weur, eeur, apac, oc)
    value: apac

  # ─── The app (templates/deployment.yaml) ────────────────────────────────────
  # The image is built and pushed by this repo's CI (the `image` job in
  # .github/workflows/ci.yml) on every merge to main, gated behind the
  # full test suite and tagged with the full git commit SHA. Releases are
  # deliberate: a firm runs exactly the tag pinned in its values file —
  # bump it and re-install to release, point it back and re-install to
  # roll back (T06 topology).
  - name: image_repo
    description: Container image repository for the law backend
    value: ghcr.io/stigmer/stigmer-apps/law-backend

  # REQUIRED, no usable default: the git commit SHA to serve this firm.
  - name: image_tag
    description: Image tag (git commit SHA) pinned for this firm; set per install
    value: ""

  - name: container_registry
    description: Planton container-registry connection for image pulls (planton.dev/container-registry annotation)
    value: ghcr-stigmer

  # REQUIRED, no usable default. MUST be a single label under a domain
  # whose cert-manager ClusterIssuer exists on the cluster: the TLS
  # issuer is derived from everything after the hostname's first dot,
  # and a name whose derived issuer is missing never gets a certificate
  # — and without HTTPS nobody can sign in (Secure session cookie).
  # Two supported shapes:
  #   - platform hostname (<firm>-law.stigmer.ai): the stigmer.ai
  #     issuer always exists — the onboarding default.
  #   - the firm's own domain (app.example-firm.com): provision that
  #     domain's ClusterIssuer + ExternalDNS instance FIRST (README,
  #     "Bring your own domain").
  # Apex hostnames (bare example-firm.com) are unsupported by the
  # derivation — it would look up an issuer literally named "com";
  # redirect the apex to the app at the DNS edge instead.
  - name: hostname
    description: Public hostname for the firm's app (single label under a domain with a ClusterIssuer)
    value: ""

  # Set ONLY during a signing-key rotation window (DD-005): the previous
  # keypair's base64 SPKI public key, so ~1h-old access tokens stay
  # verifiable; drop it after the tail expires. Public material.
  - name: auth_jwt_previous_public_key
    description: Previous JWT public key (base64 SPKI PEM) during rotation; empty otherwise
    value: ""

  # ─── The web assistant (T05 web leg) — OPTIONAL AS A GROUP ──────────────────
  # Empty agent-instance id = the firm has no Ask AI (the backend group
  # is all-or-nothing and absent config disables the feature cleanly).
  # Setting it renders the STIGMER_* env block, which then also expects
  # the platform-client id below and the platform-client-secret key in
  # the firm's auth-keys secret (fail-closed at apply/boot, never at
  # first use). The PlatformClient itself is created in the platform
  # console/API with auto_grant_role=member FROM THE FIRST APPLY — see
  # the deploy/stigmer README's web-assistant runbook.
  - name: assistant_agent_instance_id
    description: The firm's org-visible web AgentInstance id (ain_…); empty = no Ask AI
    value: ""

  - name: assistant_platform_client_id
    description: PlatformClient client_id (stgm_cid_…); its secret lives in auth-keys
    value: ""

  - name: assistant_org
    description: The platform organization hosting the firm's assistant
    value: ""

  - name: assistant_api_base_url
    description: The agent platform's API endpoint (backend mint + browser SDK)
    value: "https://api.stigmer.ai"

  - name: assistant_console_url
    description: The platform console base URL for user-facing deep links (billing)
    value: "https://app.stigmer.ai"

  # ─── OCR (Google Document AI) — OPTIONAL AS A GROUP ─────────────────────────
  # Empty processor = the firm has no OCR (the OCR env group stays
  # un-rendered). Setting it renders the OCR_* env block and expects the
  # gcp-docai-credentials key in the firm's auth-keys secret (fail-closed
  # at apply). The sweep interval is only read when the processor is set;
  # the knob is the feature gate — 0 = staged but disabled.
  - name: ocr_docai_processor
    description: Document AI processor resource name (projects/<number>/locations/<loc>/processors/<id>); empty = no OCR
    value: ""

  - name: ocr_sweep_interval_seconds
    description: OCR sweep interval in seconds; read only when the processor is set, 0 = staged but disabled
    value: "300"

  - name: app_cpu_request
    description: Backend container CPU request
    value: 50m

  - name: app_cpu_limit
    description: Backend container CPU limit
    value: 500m

  - name: app_memory_request
    description: Backend container memory request
    value: 128Mi

  - name: app_memory_limit
    description: Backend container memory limit
    value: 512Mi

  # ─── The FGA engine (DD-003; templates/openfga.yaml) ────────────────────────
  # The derived migrate-then-run image (images/openfga in this repo),
  # pushed by CI. Content-versioned by ENGINE version: bump the tag
  # deliberately, alongside the wrapper Dockerfile's upstream pin and
  # the commons test harness's pin (@stigmer/authorization testing).
  - name: openfga_image_repo
    description: Container image repository for the FGA engine wrapper
    value: ghcr.io/stigmer/stigmer-apps/law-openfga

  - name: openfga_image_tag
    description: FGA engine image tag (the wrapped OpenFGA version)
    value: v1.18.3

  - name: openfga_cpu_request
    description: FGA engine container CPU request
    value: 25m

  - name: openfga_cpu_limit
    description: FGA engine container CPU limit
    value: 250m

  - name: openfga_memory_request
    description: FGA engine container memory request
    value: 64Mi

  - name: openfga_memory_limit
    description: FGA engine container memory limit
    value: 256Mi

  # ─── Postgres (templates/postgres.yaml) ─────────────────────────────────────
  # Sized for a firm of tens of users, not the platform's workload; the
  # role (law_app) and database (law) are chart constants, not params.
  - name: postgres_replicas
    description: Postgres replica count
    value: "1"

  - name: postgres_disk_size
    description: Postgres persistent disk size
    value: 10Gi

  - name: postgres_cpu_request
    description: Postgres container CPU request
    value: 50m

  - name: postgres_cpu_limit
    description: Postgres container CPU limit
    value: 500m

  - name: postgres_memory_request
    description: Postgres container memory request
    value: 128Mi

  - name: postgres_memory_limit
    description: Postgres container memory limit
    value: 512Mi
