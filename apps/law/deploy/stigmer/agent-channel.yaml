# The WhatsApp binding — TEMPLATE (T05).
#
# ORDER MATTERS, and it is the one step manifests cannot do: applying
# this file does NOT install the number. The number is bound in the
# console first (Agent → Channels → Connect to WhatsApp, against the
# org's ChannelApp); the verified phone_number_id lands in status and
# THEN this manifest binds cleanly. Applying before the console install
# was exactly what blocked the reference deployment's last mile.
#
# LEARNED AT THE FIRST LIVE BIND (2026-08-10): when the console connect
# is done FROM THE AGENT ("Agent → Channels → Connect"), it creates the
# COMPLETE AgentChannel itself — agent_ref, app_ref, environment_refs,
# and the verified phone_number_id — under its own name
# ("<agent-slug> WhatsApp" → slug <agent-slug>-whatsapp). In that flow
# this manifest must NOT be applied under a different name (a second
# channel would claim the same number): list the org's agent-channels
# first, and either adopt the console resource's name/slug here as the
# declarative record or skip the apply entirely.
#
# proactive_messaging_enabled stays false until the hearing-reminder
# stage (T05 stage 6): the send tool and template surface only matter
# once the Meta UTILITY template is approved, and a smaller surface is
# a smaller surface.
apiVersion: agentic.stigmer.ai/v1
kind: AgentChannel
metadata:
  name: <firm>-law-whatsapp
  org: <stigmer-org>
spec:
  agent_ref:
    kind: agent
    org: <stigmer-org>
    slug: <firm>-law-assistant
  enabled: true
  proactive_messaging_enabled: false
  whatsapp:
    phone_number_id: "<from-the-console-install>"
  app_ref:
    kind: channel_app
    org: <stigmer-org>
    slug: <channel-app-slug>
  environment_refs:
    - kind: environment
      org: <stigmer-org>
      slug: <firm>-law-mcp-credentials
