# Codegen template for the Stigmer Law WEB APP. Run from the REPO ROOT via
# the root `npm run codegen` (buf generate --template ...): inputs and out
# are root-relative, so invoking it from anywhere else generates into the
# wrong place.
#
# The web app owns its own committed gen (T04b D2): it may not deep-import
# @law/backend's gen (server code), and @stigmer/identity's package export
# carries server-side dependencies a browser bundle must not touch — so the
# browser generates the SAME proto definitions into its own tree (DD-A3:
# one definition, N generated copies, CI drift-checked). Inputs cover both
# contracts a web session needs: the law resources and the identity
# auth/user surface; include_imports materializes the envelope and
# buf.validate types alongside.
version: v2
clean: true
plugins:
  # The version pin is load-bearing: unpinned, the remote registry decides
  # the generator version, and every registry release re-arms the codegen
  # drift check on the NEXT unrelated push (v2.13.0->v2.14.0 broke main,
  # 2026-08-15). Upgrading means bumping this pin AND regenerating.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: apps/law/web/src/gen
    opt:
      - target=ts
      - import_extension=js
    include_imports: true
inputs:
  - directory: apps/law/proto
  - directory: packages/identity/proto
