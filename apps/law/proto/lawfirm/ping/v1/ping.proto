// THROWAWAY (Stage A toolchain proof): this service exists only to prove
// proto -> codegen -> Connect server -> Postgres round-trips end to end.
// It is deleted when the first real resource (Case) lands. Nothing may
// depend on it.
syntax = "proto3";

package lawfirm.ping.v1;

service PingService {
  // Records one ping and returns how many pings have ever been recorded.
  // The count comes from Postgres, so a successful response proves the
  // full path: client -> Connect handler -> pg -> response.
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  // Free-form label stored with the ping; echoes back in the response.
  string label = 1;
}

message PingResponse {
  string label = 1;
  // Total pings recorded, including this one.
  int64 total_pings = 2;
}
