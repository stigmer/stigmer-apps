// The User resource — transcribed from the MVP scope contract's record
// model (design-decisions/001-mvp-scope-contract.md, amended by T03 D7).
// Deliberate absences: no update operation (profile is read-only in MVP —
// FR-USER-001 notes), no delete, and NO credential field anywhere in this
// message. Credentials live in the app-owned user_credentials table,
// written only by the operator-only SetPassword operation below — no read
// path can leak what no resource carries (T03 D7).
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-002
// addendum) — never the customer segment, never the brand.
package stigmer.law.user.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message User {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  UserSpec spec = 4 [(buf.validate.field).required = true];
}

message UserSpec {
  // Login identity and the natural key, unique across the firm. Stored
  // lowercase (normalized before persist); format validated here, casing
  // is not the client's problem (FR-USER-001).
  string email = 1 [(buf.validate.field).string.email = true];

  // Display name. Optional on input: defaults to the email local-part
  // before persist (scope contract record model).
  string name = 2;

  // Strict E.164 (e.g. +91123456 — examples and fixtures in this public
  // repo deliberately use short fictional numbers, enforced by the
  // customer-data CI guard), no spaces or dashes: accounts are
  // operator-created, so the input discipline is ours, and T05's WhatsApp
  // binding matches on this exact canonical form. Optional in MVP,
  // required in practice for WhatsApp staff.
  optional string phone = 3 [(buf.validate.field).string.pattern = "^\\+[1-9][0-9]{6,14}$"];
}

message GetUserRequest {
  // Exactly one of: internal id, or the email (the natural key operators
  // and teammates actually know). Email matching is case-insensitive.
  string id = 1;
  string email = 2;
}

message ListUsersRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];
}

message ListUsersResponse {
  // Ordered by email ascending — a deterministic order is part of every
  // list contract (T03 recipe rule; DD-001 is silent for users).
  repeated User items = 1;
  int64 total_count = 2;
}

message SetPasswordRequest {
  // Target user by internal id or email (case-insensitive).
  string id = 1;
  string email = 2;
  // Plaintext over TLS; bcrypt-hashed server-side, never stored or echoed.
  string password = 3 [(buf.validate.field).string.min_len = 8];
}

message SetPasswordResponse {}

service UserService {
  // Create a user account. Operator-only (FR-ADMIN-001): accounts are
  // created by us, no self-registration. Duplicate emails answer
  // ALREADY_EXISTS naming the value.
  rpc Create(User) returns (User);
  // Get a user by internal id or by email.
  rpc Get(GetUserRequest) returns (User);
  // List the firm's users, ordered by email.
  rpc List(ListUsersRequest) returns (ListUsersResponse);
  // Set (or reset) a user's password. Operator-only: password reset is an
  // operator action in MVP (T01 owner decision 1). The hash lands in
  // user_credentials, never in the User resource (T03 D7).
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
}
