// The Hearing resource — the model's center of gravity (DD-001): a law
// practice is matters moving through an appearance/adjournment cycle,
// and the append-only sequence of hearings IS the case diary.
//
// Two-phase life, encoded in one resource:
// - SCHEDULED: created with case, date, purpose (plus the clerk's
//   cause-list capture — serial number and hall — added the evening
//   before, FR-HEAR-006). Spec is editable while scheduled.
// - COMPLETED: RecordOutcome writes the outcome into STATUS (the
//   state-mutated-by-operation precedent) exactly once. A recorded
//   outcome is IMMUTABLE — recording again, or editing spec afterward,
//   answers FAILED_PRECONDITION. The diary does not get rewritten.
//
// Recording a next date auto-creates the NEXT scheduled hearing in the
// same operation (two sequential writes; the store deliberately has no
// cross-write transactions — Gate-1 Q3: either crash residue surfaces
// loudly as "no next date" or an unrecorded-outcome nag, both
// human-recoverable through FR-HEAR-001's direct create).
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-A2).
package stigmer.law.hearing.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "stigmer/resourceapi/v1/resource.proto";

message Hearing {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  HearingSpec spec = 4 [(buf.validate.field).required = true];
  HearingStatus status = 5;
}

message HearingSpec {
  string case_id = 1 [(buf.validate.field).string.min_len = 1];

  // Calendar date (YYYY-MM-DD) in the firm's timezone, not an instant —
  // a hearing date is a court calendar entry.
  string date = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];

  // What the matter is listed for — free text; the empirical cause-list
  // vocabulary is too court-specific for an enum (DD-001).
  string purpose = 3 [(buf.validate.field).string.max_len = 200];

  // The published cause list's serial number ("item 47") — the clerk's
  // evening capture (J2, FR-HEAR-006). Free text: courts number lists
  // in more than one shape.
  optional string list_serial_number = 4 [(buf.validate.field).string.max_len = 50];

  // The court hall for THIS listing — per hearing, not per case: halls
  // change between listings (session-4 correction).
  optional string court_hall = 5 [(buf.validate.field).string.max_len = 100];
}

message HearingStatus {
  // UNSPECIFIED means the hearing is still SCHEDULED; anything else
  // means completed. Written exactly once, by RecordOutcome.
  OutcomeKind outcome_kind = 1;

  // What happened, in the recorder's words.
  string outcome_notes = 2;

  // Who appeared for the firm — FirmMember ids.
  repeated string attended_by = 3;

  // The next date recorded with this outcome (YYYY-MM-DD), when one was
  // given — the same value that auto-scheduled the next hearing. Kept
  // here so the diary line reads complete on its own.
  optional string next_date = 4;

  // When the outcome was recorded — written once by RecordOutcome, the
  // same write that freezes the record (FR-HEAR-007). A stored domain
  // fact, not a derivation from metadata.updated_at: deriving would
  // hang the story-of-the-day feed on the non-local invariant that no
  // future operation ever touches a completed hearing. Absent on
  // hearings completed before this field existed — they honestly never
  // match a recorded-on query.
  google.protobuf.Timestamp recorded_at = 5;
}

enum OutcomeKind {
  OUTCOME_KIND_UNSPECIFIED = 0;
  // 61% of hearings (DD-001's empirical backbone) — the cycle's most
  // common beat, which is exactly why recording it must be effortless.
  OUTCOME_KIND_ADJOURNED = 1;
  OUTCOME_KIND_HEARD = 2;
  OUTCOME_KIND_ORDERS_RESERVED = 3;
  OUTCOME_KIND_ORDER_PRONOUNCED = 4;
  // Expected on the list but did not appear on it.
  OUTCOME_KIND_NOT_LISTED = 5;
  // On the list but the board never reached it.
  OUTCOME_KIND_NOT_REACHED = 6;
  OUTCOME_KIND_OTHER = 7;
}

message GetHearingRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHearingsRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];

  // One case's hearings — the diary view (FR-HEAR-003). Case content:
  // members and partners only.
  string case_id = 3;

  // Date-range view across the caller's visible cases (FR-HEAR-004):
  // today/tomorrow checklists. Both bounds inclusive, YYYY-MM-DD.
  // Non-partners see hearings of their member cases only — the matrix,
  // applied by query scoping server-side.
  string date_from = 4;
  string date_to = 5;

  // Only hearings still awaiting an outcome whose date has passed — the
  // unrecorded-outcome nag list (FR-HEAR-005).
  bool unrecorded_only = 6;

  // Hearings whose outcome was RECORDED on this calendar day
  // (YYYY-MM-DD, firm timezone) — the story-of-the-day's "what came
  // back from court" (FR-HEAR-007). Answered newest-recorded first.
  // Mutually exclusive with the other predicate shapes.
  string recorded_on = 7;

  // Hearings PUT ON THE BOARD on this calendar day (YYYY-MM-DD, firm
  // timezone) — created that day, whether auto-scheduled by an outcome
  // or entered directly (FR-HEAR-007). Answered newest first. Mutually
  // exclusive with the other predicate shapes.
  string scheduled_on = 8;
}

message ListHearingsResponse {
  // Ordered by date: ascending for range views (the day's board order);
  // a case diary reads newest first in the web app, which reverses
  // client-side per page.
  repeated Hearing items = 1;
  int64 total_count = 2;
}

message RecordOutcomeRequest {
  // The scheduled hearing being completed.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  OutcomeKind outcome_kind = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];

  string outcome_notes = 3 [(buf.validate.field).string.max_len = 5000];

  // Who appeared — FirmMember ids; existence checked.
  repeated string attended_by = 4;

  // Recording a next date schedules the next hearing in the same
  // operation (FR-HEAR-002). Must be strictly after the hearing's date.
  optional string next_date = 5 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];

  // What the next listing is for; stored on the auto-created hearing.
  optional string next_purpose = 6 [(buf.validate.field).string.max_len = 200];
}

message RecordOutcomeResponse {
  // The completed hearing, outcome now in status.
  Hearing hearing = 1;
  // The auto-scheduled next hearing, when next_date was given.
  optional Hearing next_hearing = 2;
}

service HearingService {
  // Schedule a hearing directly — the first hearing of a matter, or
  // recovery when an auto-schedule was lost (FR-HEAR-001).
  rpc Create(Hearing) returns (Hearing);
  // Update a SCHEDULED hearing (date, purpose, serial number, hall).
  // A completed hearing's record is frozen — FAILED_PRECONDITION.
  rpc Update(Hearing) returns (Hearing);
  // Record what happened — the single write path for outcomes, once.
  // Members (lawyers AND clerks — diary-keeping is the clerk's
  // documented core) and partners.
  rpc RecordOutcome(RecordOutcomeRequest) returns (RecordOutcomeResponse);
  // Get one hearing. Case content: members and partners only.
  rpc Get(GetHearingRequest) returns (Hearing);
  // List hearings: a case's diary, or a date-range checklist.
  rpc List(ListHearingsRequest) returns (ListHearingsResponse);
}
