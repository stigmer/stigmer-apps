// The Case resource — a MATTER, which exists from intake, before any
// court number (DD-001, adopted 2026-08-10; supersedes the MVP's
// five-field case wholesale inside the free-rebuild window).
//
// Deliberate shape decisions, each argued in DD-001:
// - `file_number` (firm-issued) is the natural key. The physical-folder
//   numbering is the firm's real identity system; court numbers are
//   neither unique across forums nor present at intake.
// - Lifecycle lives in STATUS, mutated only via UpdateStatus (the Task
//   precedent): closure is lifecycle, not delete — no delete exists.
// - MONEY IS ABSENT by design (session-4 correction): the fee
//   arrangement lives in the partner-gated money aggregate
//   (stigmer.law.feearrangement.v1). Case reads are member-visible and
//   must never need field-level redaction.
// - List returns CaseSummary, not Case (the only summary-shaped list in
//   the app, and deliberately so): the list line IS what non-member
//   lawyers may see (FR-AUTHZ-003), so authorization stays allow/deny —
//   list allowed for lawyer roles, Get membership-gated. Do not
//   cargo-cult this shape onto other resources; it exists for the
//   authorization boundary, not as a convention.
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-A2) —
// never the customer segment, never the brand.
package stigmer.law.case.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message Case {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  CaseSpec spec = 4 [(buf.validate.field).required = true];
  CaseStatus status = 5;
}

message CaseSpec {
  // The firm's own file number: mandatory, unique, the natural key —
  // what a lawyer says out loud when they mean this matter ("CS 142").
  // Editable on update with uniqueness re-validated.
  string file_number = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];

  // The court-issued number — optional (arrives after filing), unique
  // when present. Uniqueness is checked by a domain step and backed by a
  // partial unique index; it is NOT the natural key.
  optional string court_case_number = 2 [(buf.validate.field).string.max_len = 100];

  // The e-Courts CNR — optional; the deliberate hook for the deferred
  // e-Courts integration (DD-001: integration is OUT, the field is not).
  optional string cnr = 3 [(buf.validate.field).string.max_len = 30];

  // The client this matter is for — existence enforced by the pipeline's
  // reference check (FAILED_PRECONDITION).
  string client_id = 4 [(buf.validate.field).string.min_len = 1];

  ClientRole client_role = 5 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];

  // The other side. Without these, neither the cause-list identity
  // ("A vs B") nor the conflict check exists (FR-CLIENT-003 searches
  // these names). Free text: opposing parties are not Clients.
  repeated OpposingParty opposing_parties = 6;

  Forum forum = 7 [(buf.validate.field).required = true];

  // Firm vocabulary, free text (a managed taxonomy would be wrong
  // somewhere every week — DD-001).
  string case_type = 8 [(buf.validate.field).string.min_len = 1];

  // Court stage, free text — stages differ per forum; an enum would be
  // wrong somewhere every week (DD-001; assumption A-05 listens for a
  // stable vocabulary at the demo).
  string stage = 9;

  // The lead lawyer: a FirmMember id (all person references in law
  // resources are FirmMember ids — the app's own person concept; User
  // ids appear only inside FirmMember and the identity flows).
  string lead_lawyer_id = 10 [(buf.validate.field).string.min_len = 1];
}

message OpposingParty {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  // Opposing counsel, when known — how district practice refers to the
  // other side ("Sri Rao's client").
  string counsel_name = 2 [(buf.validate.field).string.max_len = 200];
}

// Where the matter is heard — structured data ON the case; forum is
// deliberately NOT its own resource (a reference table for no query —
// DD-001). Deadline RULES per forum stay knowledge, never data.
message Forum {
  ForumKind forum_kind = 1 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
  // "III Additional District Court, Hyderabad" — the name the cause
  // list prints.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  // The bench/court-hall the matter usually sits in, when stable. The
  // PER-HEARING hall lives on Hearing (session-4 correction: halls
  // change between listings).
  optional string bench = 3 [(buf.validate.field).string.max_len = 100];
}

enum ForumKind {
  FORUM_KIND_UNSPECIFIED = 0;
  FORUM_KIND_DISTRICT_COURT = 1;
  FORUM_KIND_HIGH_COURT = 2;
  FORUM_KIND_NCLT = 3;
  FORUM_KIND_DRT = 4;
  FORUM_KIND_CONSUMER_FORUM = 5;
  FORUM_KIND_OTHER = 6;
}

enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_PLAINTIFF = 1;
  CLIENT_ROLE_DEFENDANT = 2;
  CLIENT_ROLE_PETITIONER = 3;
  CLIENT_ROLE_RESPONDENT = 4;
  CLIENT_ROLE_COMPLAINANT = 5;
  CLIENT_ROLE_ACCUSED = 6;
  CLIENT_ROLE_APPELLANT = 7;
  CLIENT_ROLE_OTHER = 8;
}

message CaseStatus {
  // Stored lifecycle: ACTIVE on create, mutated only via UpdateStatus.
  // Closed/disposed cases leave working views but remain the record.
  CaseLifecycle lifecycle = 1;

  // The earliest FUTURE scheduled hearing's date (YYYY-MM-DD), or unset
  // when none — "no next date", the matters-needing-attention signal.
  // STORED-DERIVED (the app's one documented DD-A6 exception, Gate-1
  // Q6): recomputed from Hearings by a single system writer on every
  // hearing write, because list predicates filter on it and the store
  // cannot join kinds. Never written by clients.
  optional string next_hearing_date = 2 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];

  // Derived on read, never stored (one grouped query per page).
  int32 document_count = 3;

  // Open deadlines on this matter, derived on read per page.
  int32 open_deadline_count = 4;
}

enum CaseLifecycle {
  // Treated as ACTIVE (the create default) everywhere.
  CASE_LIFECYCLE_UNSPECIFIED = 0;
  CASE_LIFECYCLE_ACTIVE = 1;
  CASE_LIFECYCLE_DISPOSED = 2;
  CASE_LIFECYCLE_CLOSED = 3;
}

// The list line — exactly what FR-AUTHZ-003 lets a non-member lawyer
// see: existence without content. Everyone's case list is this shape;
// full content is Get + the case-scoped reads, membership-gated.
message CaseSummary {
  string id = 1;
  string file_number = 2;
  // "A vs B" — client display name vs first opposing party, derived per
  // page (one grouped lookup, never N+1).
  string caption = 3;
  ForumKind forum_kind = 4;
  string forum_name = 5;
  // Mirrors status.next_hearing_date; unset means no next date.
  optional string next_hearing_date = 6;
  CaseLifecycle lifecycle = 7;
}

message GetCaseRequest {
  // Exactly one of: internal id, or the firm file number (lawyers speak
  // in file numbers — the assistant's case tools resolve by natural key).
  string id = 1;
  string file_number = 2;
}

message ListCasesRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];

  // Named list predicate: cases whose next hearing falls within
  // [today, today + N] in the firm's timezone, both ends inclusive.
  // 0 means no narrowing; capped at 90 — "upcoming" is an operational
  // horizon, not a report.
  int32 hearing_within_days = 3 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 90
  }];

  // Named list predicate: cases with NO future hearing scheduled — the
  // matters-needing-attention question a date range cannot express.
  // Mutually exclusive with hearing_within_days; setting both is
  // INVALID_ARGUMENT. (Renamed from the MVP's "unscheduled"; DD-001
  // session-4 correction renamed the concept to "no next date".)
  bool no_next_date = 4;

  // Named list predicate: cases where the caller is the lead lawyer or
  // an active case member — "my cases".
  bool mine = 5;

  // Narrow to one client's matters (the client detail view).
  string client_id = 6;

  // Narrow by forum kind ("our NCLT matters").
  ForumKind forum_kind = 7 [(buf.validate.field).enum.defined_only = true];

  // Narrow by lifecycle; UNSPECIFIED means active-only (the working
  // default — closed matters are the archive, asked for explicitly).
  CaseLifecycle lifecycle = 8 [(buf.validate.field).enum.defined_only = true];
}

message ListCasesResponse {
  // Ordered by next hearing date ascending, dateless cases last — the
  // ordering is part of the list contract, fixed server-side.
  repeated CaseSummary items = 1;
  int64 total_count = 2;
}

message UpdateCaseStatusRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // ACTIVE/DISPOSED/CLOSED; UNSPECIFIED is rejected. Free transitions —
  // a disposed matter can be restored (appeals happen).
  CaseLifecycle lifecycle = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
}

service CaseService {
  // Create a case at intake. Duplicate file numbers answer
  // ALREADY_EXISTS naming the value; the client and lead lawyer must
  // exist (FAILED_PRECONDITION otherwise).
  rpc Create(Case) returns (Case);
  // Update a case: full spec replacement; file_number re-validated
  // unique; lifecycle is NOT part of spec and survives updates.
  rpc Update(Case) returns (Case);
  // Change the lifecycle — the only write path for status.lifecycle.
  rpc UpdateStatus(UpdateCaseStatusRequest) returns (Case);
  // Get a case by internal id or firm file number. Membership-gated:
  // non-members of the case are refused (FR-AUTHZ-002/003).
  rpc Get(GetCaseRequest) returns (Case);
  // List case summaries — the list line, visible to all lawyer roles.
  rpc List(ListCasesRequest) returns (ListCasesResponse);
}
