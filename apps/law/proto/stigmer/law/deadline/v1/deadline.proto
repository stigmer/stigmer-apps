// The Deadline resource — lawyer-entered, statutorily informed,
// relentlessly surfaced (DD-001). Deliberately NOT a rules engine: the
// system never computes a limitation date (FR-DEAD-003) — a wrong
// computed date is worse than none because it is trusted. The lawyer
// enters the date; the product's job is to make missing it impossible
// to do quietly.
//
// Status transitions are EXPLICIT HUMAN ACTS through UpdateStatus —
// `missed` is set by a person, never by the sweep: the system surfaces
// an overdue open deadline forever (FR-DEAD-002); it does not
// adjudicate what the silence meant.
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-A2).
package stigmer.law.deadline.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message Deadline {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  DeadlineSpec spec = 4 [(buf.validate.field).required = true];
  DeadlineStatus status = 5;
}

message DeadlineSpec {
  string case_id = 1 [(buf.validate.field).string.min_len = 1];

  // What must happen — "File written statement".
  string title = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];

  // Calendar date (YYYY-MM-DD) in the firm's timezone.
  string due_date = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];

  // Where the date comes from, in the lawyer's words: "O.VIII R.1 — 30
  // days from summons served 12-08". Free text; knowledge stays in the
  // lawyer (FR-DEAD-003).
  string statutory_basis = 4 [(buf.validate.field).string.max_len = 500];

  // The FirmMember answerable for it — who the escalating notifications
  // reach (FR-DEAD-002).
  string owner_id = 5 [(buf.validate.field).string.min_len = 1];
}

message DeadlineStatus {
  // OPEN on create; mutated only via UpdateStatus, only by humans.
  DeadlineState state = 1;

  // Derived on read against today in the firm's timezone: due_date
  // passed and still OPEN. Never stored; the list filter and this
  // derivation share one rule.
  bool overdue = 2;
}

enum DeadlineState {
  DEADLINE_STATE_UNSPECIFIED = 0;
  DEADLINE_STATE_OPEN = 1;
  DEADLINE_STATE_MET = 2;
  // A human's admission, never the system's verdict.
  DEADLINE_STATE_MISSED = 3;
  // The obligation dissolved (matter settled, order vacated).
  DEADLINE_STATE_WITHDRAWN = 4;
}

message GetDeadlineRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListDeadlinesRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];

  // One case's deadlines. Case content: members and partners only.
  string case_id = 3;

  // The caller's own deadlines on their visible cases — "my deadlines"
  // (owner view). Like every list shape, this intersects with the
  // member-case visibility matrix: an owned deadline on a case the
  // caller cannot work does not list (the list never shows what Get
  // would refuse).
  bool mine = 4;

  // Only OPEN deadlines (the working view; resolved ones are record).
  bool open_only = 5;

  // Due-date window, both bounds inclusive, YYYY-MM-DD — "landing this
  // week" (J1).
  string due_from = 6;
  string due_to = 7;

  // Deadlines ENTERED on this calendar day (YYYY-MM-DD, firm timezone)
  // — the story-of-the-day's "new obligations on the book"
  // (FR-HEAR-007). Answered newest first. Composes with the other
  // filters like any predicate.
  string entered_on = 8;
}

message ListDeadlinesResponse {
  // Ordered by due date ascending — most urgent first.
  repeated Deadline items = 1;
  int64 total_count = 2;
}

message UpdateDeadlineStatusRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // OPEN → MET | MISSED | WITHDRAWN, and back to OPEN if a resolution
  // was premature. UNSPECIFIED is rejected.
  DeadlineState state = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
}

service DeadlineService {
  // Create a deadline on a case. Members with lawyer roles and partners
  // (matrix: clerks do not enter deadlines); case and owner must exist.
  rpc Create(Deadline) returns (Deadline);
  // Update a deadline (title, basis, date, owner): the owner and
  // partners.
  rpc Update(Deadline) returns (Deadline);
  // Resolve or reopen — the only write path for status.state; a human
  // act by the owner or a partner.
  rpc UpdateStatus(UpdateDeadlineStatusRequest) returns (Deadline);
  // Get one deadline. Case content: members and partners only.
  rpc Get(GetDeadlineRequest) returns (Deadline);
  // List deadlines: by case, mine, open-only, or a due-date window.
  rpc List(ListDeadlinesRequest) returns (ListDeadlinesResponse);
}
