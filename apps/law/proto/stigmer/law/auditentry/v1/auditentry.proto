// The AuditEntry resource — the append-only change history on the
// record-bearing kinds: Case, Hearing, Deadline, FeeArrangement,
// LedgerEntry (FR-AUDIT-001). Who, when, created-or-updated, and the
// field-level delta.
//
// SYSTEM-WRITTEN ONLY (the Notification precedent): no Create RPC
// exists on the wire; a resource-event subscriber diffs the previous
// and new state and writes entries in-process through the pipeline
// invoker. The natural key `{kind}:{id}:v{version}` makes duplicate
// event delivery harmless — one entry per version, by construction.
//
// RECORDED LIMITATION (Gate-1 Q8, signed with the contract): the event
// publisher is best-effort by a documented commons decision — a crash
// between persist and publish loses the event, hence the audit row.
// Accepted while production holds only fictional data (real data is
// gated behind T07); the durable dispatcher is the publisher's own
// named revisit point. This comment is the contract's memory of that
// trade-off.
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-A2).
package stigmer.law.auditentry.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message AuditEntry {
  string api_version = 1;
  string kind = 2;
  // System-managed; created_at is when the change was recorded.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  AuditEntrySpec spec = 4 [(buf.validate.field).required = true];
}

message AuditEntrySpec {
  // The audited resource: its kind ("Case", "Hearing", …) and id.
  string subject_kind = 1 [(buf.validate.field).string.min_len = 1];
  string subject_id = 2 [(buf.validate.field).string.min_len = 1];

  // The case the change belongs to — how the history is read (per case,
  // by partners). For a Case, its own id.
  string case_id = 3 [(buf.validate.field).string.min_len = 1];

  ChangeType change_type = 4 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];

  // Who made the change: the caller principal's id and kind ("user",
  // "operator", "system") as the pipeline stamped them.
  string actor_id = 5 [(buf.validate.field).string.min_len = 1];
  string actor_kind = 6 [(buf.validate.field).string.min_len = 1];

  // What changed, field by field: proto3-JSON paths under spec/status
  // with both sides rendered as JSON text. Empty for CREATED (the
  // created resource is its own record).
  repeated FieldChange changes = 7;

  // `{subject_kind}:{subject_id}:v{version}` — the idempotency owner
  // (natural key, unique): one entry per resource version, no matter
  // how many times the event is delivered.
  string dedup_key = 8 [(buf.validate.field).string.min_len = 1];
}

message FieldChange {
  // "spec.dueDate", "status.lifecycle" — the stored proto3-JSON path.
  string field_path = 1;
  // JSON-rendered values; empty string means the side was absent.
  string old_value = 2;
  string new_value = 3;
}

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_CREATED = 1;
  CHANGE_TYPE_UPDATED = 2;
}

message ListAuditEntriesRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];

  // The case whose history is asked for. Required — history is read per
  // matter, by partners (FR-AUDIT-001).
  string case_id = 3 [(buf.validate.field).string.min_len = 1];
}

message ListAuditEntriesResponse {
  // Newest first — "what happened on this matter lately".
  repeated AuditEntry items = 1;
  int64 total_count = 2;
}

service AuditEntryService {
  // List a case's change history, newest first. Partners only. There is
  // deliberately no Create (system-written), no Get, no update, no
  // delete — an audit trail that can be edited is not one.
  rpc List(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);
}
