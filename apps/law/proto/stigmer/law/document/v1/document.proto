// The Document resource — transcribed from the MVP scope contract's
// record model (design-decisions/001-mvp-scope-contract.md).
//
// DELIBERATE WIRE SHAPE (T03 D6): this service declares Get and List
// ONLY. Bytes never ride Connect unary — a 25 MB file inside a resource
// message would land base64-encoded in the row. Upload and Download are
// plain HTTP routes beside the Connect adapter (POST
// /files/cases/{case_id}/documents, GET /files/documents/{id}/content),
// authenticated by the same caller seam, authorized by the same policy
// module, and running the same create pipeline through the in-process
// invoker. ALL byte access is backend-mediated — clients never touch the
// bucket (scope contract).
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-002
// addendum) — never the customer segment, never the brand.
package stigmer.law.document.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message Document {
  string api_version = 1;
  string kind = 2;
  // System-managed; created_by/created_at are the uploader and time.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  DocumentSpec spec = 4 [(buf.validate.field).required = true];
  DocumentStatus status = 5;
}

// System-owned extraction record (FR-DOC-003): written ONLY by the
// extraction sweep through the system update operation — no wire path
// can set it. The spec (the record) stays immutable; this block is the
// machinery's honest report of what it could read.
message DocumentStatus {
  ExtractionState extraction = 1;
  // Pages extracted (DocumentPage rows); 0 unless EXTRACTED.
  int32 page_count = 2;
}

enum ExtractionState {
  // Rows predating extraction (and fresh uploads before their first
  // sweep): treated as PENDING by the sweep, which is what makes the
  // backfill automatic — no migration touches existing rows.
  EXTRACTION_STATE_UNSPECIFIED = 0;
  EXTRACTION_STATE_PENDING = 1;
  // The text layer is in DocumentPage rows, searchable and readable.
  EXTRACTION_STATE_EXTRACTED = 2;
  // Parsed fine but carries no usable text — a scan, a photo, or an
  // image-only PDF. The honest state the assistant reports as "a scan
  // I can't read yet"; the OCR sweep's queue predicate — OCR reads
  // these and flips them to EXTRACTED (DD-009).
  EXTRACTION_STATE_NO_TEXT_LAYER = 3;
  // The parser rejected the bytes (corrupt or encrypted file).
  // Terminal: a deterministic failure would fail identically on every
  // sweep, so retrying would be a poison-pill loop. Transient failures
  // (bucket or store unreachable) never reach this state — the sweep
  // leaves them PENDING and the next tick is the retry.
  EXTRACTION_STATE_FAILED = 4;
  // The OCR provider deterministically rejected the bytes — the scan
  // could not be read. Terminal for the same reason FAILED is: the
  // same bytes fail identically on every sweep. Configuration and
  // transient failures never reach this state — the OCR sweep leaves
  // those NO_TEXT_LAYER and retries (DD-009's three-way rule; a
  // config error must never write a document verdict).
  EXTRACTION_STATE_OCR_FAILED = 5;
}

message DocumentSpec {
  // The case this document belongs to — existence enforced by the
  // pipeline's reference check (FAILED_PRECONDITION). EMPTY means the
  // FIRM LIBRARY (FR-DOC-005): public-record material (standalone
  // citations) that belongs to no matter, visible to everyone who
  // works cases. Empty is pipeline-enforced to the library category
  // ONLY (judgment), which makes "case-less ⇒ library material" an
  // invariant the policy keys on. Kept a plain string (not
  // `optional`): proto3-JSON omits the empty value, so the stored
  // rows and generated columns read exactly like an absent field,
  // and every existing `?? ""` call site behaves unchanged.
  string case_id = 1;

  // Original filename, shown in lists and set as the download name.
  string file_name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 255
  }];

  // PDF, PNG, and JPG only (scope contract).
  string mime_type = 3 [(buf.validate.field).string = {
    in: ["application/pdf", "image/png", "image/jpeg"]
  }];

  // Object size; the upload route enforces the 25 MB cap while reading.
  int64 size_bytes = 4 [(buf.validate.field).int64 = {
    gt: 0,
    lte: 26214400
  }];

  // Where the bytes live in the private bucket. Set by the upload route
  // BEFORE the row is created (the object is uploaded first), so a
  // persisted document always has its bytes — the only possible
  // inconsistency is an invisible unreferenced object, never a download
  // that 404s. Never exposed to clients as a bucket URL.
  string object_key = 5 [(buf.validate.field).string.min_len = 1];

  // What kind of paper this is (DD-001, adopted 2026-08-10).
  // VAKALATNAMA is its own category by session-4 correction — the
  // authority to appear is filed in every litigation matter and must
  // not land in OTHER. JUDGMENT is the deliberate hook for the deferred
  // knowledge base (FR-DOC-002): the collection accumulates from day
  // one, taggable and listable, before the KB feature exists.
  DocumentCategory category = 6 [(buf.validate.field).enum.defined_only = true];

  // The hearing this document belongs to, when it belongs to one — an
  // order to the hearing it was pronounced at, a filing to the listing
  // it served. Optional; existence checked when set. Refused on
  // library documents (a hearing reference without a case is
  // meaningless).
  optional string hearing_id = 7;
}

enum DocumentCategory {
  // Treated as OTHER in views; stored as sent (uploads predating the
  // category, and callers who don't know, both land here honestly).
  DOCUMENT_CATEGORY_UNSPECIFIED = 0;
  DOCUMENT_CATEGORY_PLEADING = 1;
  DOCUMENT_CATEGORY_APPLICATION = 2;
  DOCUMENT_CATEGORY_EVIDENCE = 3;
  DOCUMENT_CATEGORY_ORDER_JUDGMENT = 4;
  DOCUMENT_CATEGORY_CORRESPONDENCE = 5;
  DOCUMENT_CATEGORY_VAKALATNAMA = 6;
  DOCUMENT_CATEGORY_JUDGMENT = 7;
  DOCUMENT_CATEGORY_OTHER = 8;
  // 9 was DOCUMENT_CATEGORY_ACT (bare-act texts, FR-DOC-005) —
  // removed with the acts feature (owner decision, 2026-08-19).
  // Reserved, never renumbered: category words are stamped into
  // persisted rows, so reusing the value would silently relabel any
  // historical data.
  reserved 9;
  reserved "DOCUMENT_CATEGORY_ACT";
}

message GetDocumentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// The extraction sweep's status report (FR-DOC-003). Status is
// system-owned, and the generic update pipeline enforces that by
// KEEPING stored status (commons buildUpdateState) — so this write is
// a named custom operation instead, the Case.UpdateStatus arrangement.
// Every wire caller is refused by policy; only the in-process system
// principal passes.
message RecordDocumentExtractionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  ExtractionState extraction = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]  // UNSPECIFIED means "never swept" — never written back
  }];
  int32 page_count = 3 [(buf.validate.field).int32.gte = 0];
}

message ListDocumentsRequest {
  // The case whose documents are asked for. Required unless category
  // is JUDGMENT — the firm-wide collection view (FR-DOC-002: the
  // knowledge-base collection), still subject to the caller's case
  // visibility — or unless library_only is set.
  string case_id = 1;

  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 3 [(buf.validate.field).int32.gte = 0];

  // Narrow to one category (a case's orders, the judgment collection).
  DocumentCategory category = 4 [(buf.validate.field).enum.defined_only = true];

  // Only the FIRM LIBRARY's documents (case-less rows, FR-DOC-005) —
  // the Library screen's own pile, distinct from the case-bound
  // collection views so no consumer ever needs offset-merged
  // pagination across the two. Composes with category.
  bool library_only = 5;
}

message ListDocumentsResponse {
  // Newest first.
  repeated Document items = 1;
  int64 total_count = 2;
}

service DocumentService {
  // Get a document's metadata by internal id. Bytes are served by the
  // download route, never by this RPC.
  rpc Get(GetDocumentRequest) returns (Document);
  // List a case's documents, newest first.
  rpc List(ListDocumentsRequest) returns (ListDocumentsResponse);
  // System-only (see RecordDocumentExtractionRequest): the wire refuses
  // every caller; the extraction sweep reaches it through invoke.
  rpc RecordExtraction(RecordDocumentExtractionRequest) returns (Document);
}
