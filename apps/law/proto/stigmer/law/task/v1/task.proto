// The Task resource — transcribed from the MVP scope contract's record
// model (design-decisions/001-mvp-scope-contract.md). Deliberate shape
// decisions: lifecycle state lives in STATUS (stored, mutated only via the
// dedicated UpdateStatus operation — clients cannot smuggle a state change
// through Update, whose pipeline preserves stored status); `overdue` is
// derived on read, never stored; no delete.
syntax = "proto3";

// Package convention: `stigmer.<domain>.<resource>.v1` pairs with
// apiVersion `<domain>.stigmer.ai/v1`; the domain is "law" (DD-002
// addendum) — never the customer segment, never the brand.
package stigmer.law.task.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message Task {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  TaskSpec spec = 4 [(buf.validate.field).required = true];
  TaskStatus status = 5;
}

message TaskSpec {
  // The case this task belongs to (mandatory) — existence enforced by the
  // pipeline's reference check, answering FAILED_PRECONDITION.
  string case_id = 1 [(buf.validate.field).string.min_len = 1];

  string title = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];

  string description = 3;

  // Optional single assignee — a FirmMember id (all person references
  // in law resources are FirmMember ids); a change to a different,
  // non-actor member publishes the TASK_ASSIGNMENT notification.
  optional string assignee_id = 4;

  // Calendar date (YYYY-MM-DD), not an instant — same reasoning as
  // Case.next_hearing_date. Unset means no due date (never overdue).
  optional string due_date = 5 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];

  // Defaults to MEDIUM when unspecified (record model) — applied by a
  // domain step before persist, so the stored row always carries a
  // concrete priority.
  TaskPriority priority = 6 [(buf.validate.field).enum.defined_only = true];
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_MEDIUM = 2;
  TASK_PRIORITY_HIGH = 3;
}

message TaskStatus {
  // Stored lifecycle state: OPEN on create, mutated only via UpdateStatus
  // (the commons preserves stored status across Update).
  TaskState state = 1;

  // Derived on read against today's date in the firm's timezone
  // (Asia/Kolkata): due_date passed and not CLOSED. Never stored.
  bool overdue = 2;

  // The referenced case's firm FILE number, derived on read (T04b D9) —
  // lawyers speak in file numbers, and every consumer that lists tasks
  // (web task lists, the assistant's task tools) needs it without
  // joining client-side. One grouped lookup per page (the document_count
  // arrangement). Never stored.
  string case_file_number = 3;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_OPEN = 1;
  TASK_STATE_IN_PROGRESS = 2;
  TASK_STATE_CLOSED = 3;
}

message GetTaskRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// Named list predicates (T05) — the server defines what each means and
// implements it exactly once, beside the derivation it must agree with.
// Deliberately NOT a field+operator grammar: a caller who can assemble
// arbitrary predicates can assemble one the derivation does not
// implement, and then a count and the list it opens disagree (the
// platform's channel-conversation filter records the same reasoning).
enum TaskListFilter {
  // No narrowing.
  TASK_LIST_FILTER_UNSPECIFIED = 0;
  // Not finished: state OPEN or IN_PROGRESS.
  TASK_LIST_FILTER_OPEN = 1;
  // Open AND the due date has passed in the firm's timezone — the exact
  // rule that derives status.overdue, shared from one module and pinned
  // by an agreement test.
  TASK_LIST_FILTER_OVERDUE = 2;
}

// Whose tasks a list request means (T05). The pre-T05 contract's silent
// default — no case_id and no assignee_id means "My Tasks" — made a
// firm-wide question UNEXPRESSABLE: there was no request shape meaning
// "everyone's tasks", so a firm overview would have quietly reported
// only the caller's own counts. Widening the view is now a visible,
// deliberate act in the request, never a side effect of which filters
// happen to be set.
enum TaskListScope {
  // The contract's default: behaves exactly like MINE.
  TASK_LIST_SCOPE_UNSPECIFIED = 0;
  // The caller's own assignments (when no explicit case/assignee filter
  // is set — an explicit filter already names its scope).
  TASK_LIST_SCOPE_MINE = 1;
  // The whole firm's tasks — for partners, exactly that; for everyone
  // else the server narrows to the caller's member cases (the matrix,
  // FR-AUTHZ-002/003, applied by query scoping — the request widens the
  // ask, never the visibility).
  TASK_LIST_SCOPE_FIRM = 2;
}

message ListTasksRequest {
  // Defaults to 20 (the contract's page size), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];

  // Filters. When neither is set (and scope is not FIRM) the list
  // defaults to the caller's own assignments — "My Tasks" (FR-TASK scope
  // contract). case_id serves the case detail view; assignee_id serves
  // an explicit person view.
  string case_id = 3;
  string assignee_id = 4;

  TaskListFilter filter = 5 [(buf.validate.field).enum.defined_only = true];
  TaskListScope scope = 6 [(buf.validate.field).enum.defined_only = true];
}

message ListTasksResponse {
  // Ordered by due_date ascending, dateless tasks last (the list
  // contract, fixed server-side).
  repeated Task items = 1;
  int64 total_count = 2;
}

message UpdateTaskStatusRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Free transitions between OPEN/IN_PROGRESS/CLOSED (the contract
  // defines no transition rules); UNSPECIFIED is rejected.
  TaskState state = 2 [(buf.validate.field).enum = {
    defined_only: true,
    not_in: [0]
  }];
}

service TaskService {
  // Create a task on a case. The referenced case (and assignee, if set)
  // must exist — FAILED_PRECONDITION otherwise.
  rpc Create(Task) returns (Task);
  // Update a task: full spec replacement; lifecycle state is NOT part of
  // spec and survives updates untouched.
  rpc Update(Task) returns (Task);
  // Change the lifecycle state — the only write path for status.state.
  rpc UpdateStatus(UpdateTaskStatusRequest) returns (Task);
  // Get a task by internal id.
  rpc Get(GetTaskRequest) returns (Task);
  // List tasks: soonest due first, dateless last; defaults to "My Tasks".
  rpc List(ListTasksRequest) returns (ListTasksResponse);
}
