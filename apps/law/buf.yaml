# Proto contracts for the lawfirm-assistant product. Proto-first: every
# backend feature starts here; TypeScript types are generated, never
# hand-written (stigmer DD-007: generated types are the source of truth).
#
# proto-vendor/ is a byte-for-byte copy of @stigmer/resource-api's envelope
# protos (buf cannot resolve imports from node_modules); CI diffs it
# against the installed package so it can never drift silently. Replace
# with a BSR dependency once the commons publishes its module.
version: v2
modules:
  - path: proto
  - path: proto-vendor
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    # The resource-API convention (shared with the stigmer platform):
    # create/update take the resource message and return it.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
