// The shared User resource — identity attributes ONLY (DD-005 profile
// pattern): email is the login identity, name the display identity, phone
// the channel-binding identity. Vertical-specific person data (a lawyer's
// bar number, a gym member's plan) lives in vertical-owned profile
// resources that reference this user's id — verticals extend by
// reference, never by widening this message.
//
// Deliberate absences carried from the first consumer's contract
// (Stigmer Law DD-001, T03 D7): no delete, and NO credential field
// anywhere in this message. Credentials live in the identity-owned
// user_credentials table, written only by the operator-only SetPassword
// operation below — no read path can leak what no resource carries.
// The original "no update" deferral ("profile read-only until a vertical
// needs otherwise") was cashed by the first consumer's channel binding
// (T05): a staff member's phone number change must be recordable, so
// Update exists — operator-only by consumer policy, see the RPC comment.
syntax = "proto3";

// Package convention (DD-A2 as amended by DD-005): commons resources are
// named by capability — `identity` — pairing with apiVersion
// `identity.stigmer.ai/v1`. Never a brand, never a repo-layout word.
package stigmer.identity.user.v1;

import "buf/validate/validate.proto";
import "stigmer/resourceapi/v1/resource.proto";

message User {
  string api_version = 1;
  string kind = 2;
  // System-managed; the pipeline overwrites whatever a client sends.
  stigmer.resourceapi.v1.ResourceMetadata metadata = 3;
  UserSpec spec = 4 [(buf.validate.field).required = true];
}

message UserSpec {
  // Login identity and the natural key, unique per deployment. Stored
  // lowercase (normalized before persist); format validated here, casing
  // is not the client's problem.
  string email = 1 [(buf.validate.field).string.email = true];

  // Display name. Optional on input: defaults to the email local-part
  // before persist.
  string name = 2;

  // Strict E.164 (e.g. +91123456 — examples and fixtures deliberately use
  // short fictional numbers, enforced by the customer-data CI guard), no
  // spaces or dashes: accounts are operator-created, so the input
  // discipline is ours, and channel bindings (WhatsApp) match on this
  // exact canonical form. Optional; required in practice for channel
  // staff.
  optional string phone = 3 [(buf.validate.field).string.pattern = "^\\+[1-9][0-9]{6,14}$"];
}

message GetUserRequest {
  // Exactly one of: internal id, or the email (the natural key operators
  // and teammates actually know). Email matching is case-insensitive.
  string id = 1;
  string email = 2;
}

message ListUsersRequest {
  // Defaults to 20 (the commons list contract), capped at 100.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 100
  }];
  int32 page_offset = 2 [(buf.validate.field).int32.gte = 0];
}

message ListUsersResponse {
  // Ordered by email ascending — a deterministic order is part of every
  // list contract.
  repeated User items = 1;
  int64 total_count = 2;
}

message SetPasswordRequest {
  // Target user by internal id or email (case-insensitive).
  string id = 1;
  string email = 2;
  // Plaintext over TLS; bcrypt-hashed server-side, never stored or echoed.
  string password = 3 [(buf.validate.field).string.min_len = 8];
}

message SetPasswordResponse {}

service UserService {
  // Create a user account. Operator-only (consumer policy): accounts are
  // created by an operator, no self-registration. Duplicate emails answer
  // ALREADY_EXISTS naming the value.
  rpc Create(User) returns (User);
  // Update a user: full spec replacement, the resource-API update
  // convention (read-modify-write; an omitted optional field — phone —
  // clears it). Email, the natural key, is editable with uniqueness
  // re-validated (the case-number-correction precedent); login follows
  // the new email immediately because credentials key on the user id.
  // Operator-only (consumer policy), the same tier as Create/SetPassword
  // — and not one notch lower: spec.phone is the WhatsApp channel
  // binding, so whoever may update a user decides which verified sender
  // RESOLVES TO that user. A firm member allowed to update even their
  // own profile would hold a self-service impersonation lever (the class
  // of mistake recorded as the first consumer's wrong-assumptions/001).
  rpc Update(User) returns (User);
  // Get a user by internal id or by email.
  rpc Get(GetUserRequest) returns (User);
  // List users, ordered by email.
  rpc List(ListUsersRequest) returns (ListUsersResponse);
  // Set (or reset) a user's password. Operator-only: password reset is an
  // operator action. The hash lands in user_credentials, never in the
  // User resource. Resetting also revokes the user's refresh sessions
  // (DD-005 D9) — this is the offboarding lever.
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
}
