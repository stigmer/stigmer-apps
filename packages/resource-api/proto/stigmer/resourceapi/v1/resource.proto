// The common resource envelope. Every resource served through
// @stigmer/resource-api carries: api_version, kind, metadata (this file),
// spec (user-provided), status (system-managed) — the stigmer commons
// standard.
//
// This is deliberately NOT stigmer's platform ApiResourceMetadata: vertical
// products need none of its org/slug/visibility/content-hash-version
// machinery, and audit fields live directly on metadata here (per the
// products' scope contracts) rather than under status.audit as in the Java
// edition.
syntax = "proto3";

package stigmer.resourceapi.v1;

import "google/protobuf/timestamp.proto";

// System-managed identity and audit fields. Clients never set these; the
// pipeline's build-state step overwrites whatever a client sends.
message ResourceMetadata {
  // Internal identifier: `{prefix}_{ULID}` (lowercase). ULIDs sort by
  // creation time, which keeps primary-key locality in ordered stores —
  // same scheme as the Go edition.
  string id = 1;

  google.protobuf.Timestamp created_at = 2;
  Actor created_by = 3;
  google.protobuf.Timestamp updated_at = 4;
  Actor updated_by = 5;

  // Monotonic per-resource write counter: 1 on create, +1 per update. A
  // plain counter, not stigmer's content-hash version — vertical products
  // need "how many times has this changed", not content addressing.
  int64 version = 6;
}

// The principal recorded in audit fields. Kept minimal on purpose: display
// enrichment (names, avatars) is a read-side concern, never stored.
message Actor {
  string id = 1;

  // The principal's kind: `user`, `operator` or `system` — the pipeline's
  // caller vocabulary, stamped by the build-state step from the caller it
  // authorized. Provenance lives wholly here so a resource's spec never has
  // to carry a copy of who wrote it; a spec that did would make a retried
  // system write and a user's identical recovery write compare as
  // different content (stigmer-cloud invest-autopilot T03 D1, S29). No
  // validation rule on purpose: client-sent metadata is discarded, and a
  // rule here would drag buf.validate into the one generated file this
  // package ships.
  string kind = 2;
}
