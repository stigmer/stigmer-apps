# Two modules: `proto` is the envelope contract consumers import — it
# ships with the npm package AND is published to the Buf Schema Registry
# as buf.build/stigmer/resourceapi (consumers declare it as a buf dep;
# nobody vendors these files). `testproto` is the fixture module for the
# commons' own tests and never ships.
version: v2
modules:
  - path: proto
    name: buf.build/stigmer/resourceapi
  - path: testproto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    # The resource-API convention (shared with buf.build/stigmer/stigmer):
    # create/update take the resource message and return it — request
    # wrappers around a resource that IS the request add nothing.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
