# Codegen template for the commons. Run from the REPO ROOT via the root
# `npm run codegen` (buf generate --template ...): inputs and out are
# root-relative, so invoking it from anywhere else generates into the
# wrong place.
#
# protoc-gen-es v2 only: it also emits Connect service descriptors, which
# @connectrpc/connect v2 consumes directly. import_extension=js keeps
# generated relative imports Node-resolvable (DD-018).
# include_imports materializes buf.validate and well-known types so the
# package has no generated-code dependency outside itself.
version: v2
clean: true
plugins:
  - remote: buf.build/bufbuild/es
    out: packages/resource-api/src/gen
    opt:
      - target=ts
      - import_extension=js
    include_imports: true
inputs:
  - directory: packages/resource-api/proto
  - directory: packages/resource-api/testproto
